version: "2"

run:
  # The tag builds every file the fast loop does and the integration
  # tests besides, so one run lints the whole tree.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - exhaustive
    - gochecksumtype
  settings:
    gochecksumtype:
      # A default case does not stand in for a variant: every variant of a
      # sealed union is listed in every switch over it.
      default-signifies-exhaustive: false

formatters:
  enable:
    - gofmt
