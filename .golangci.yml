version: "2"

run:
  # the integration tests are linted with the rest, so no gated file can
  # stop compiling unseen
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - exhaustive
    - gochecksumtype
  settings:
    gochecksumtype:
      # A default case does not stand in for a variant: every variant of a
      # sealed union is listed in every switch over it.
      default-signifies-exhaustive: false

formatters:
  enable:
    - gofmt
